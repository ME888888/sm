---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y年%m月%d日' }}</time>
      {% if page.categories %} | <span>{{ page.categories }}</span>{% endif %}
    </div>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
